<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Proxy</title>
</head>
<body>
    <script>
        // This page serves as a secure proxy for the Squarespace API
        // It will be hosted on GitHub Pages

        const SQUARESPACE_API_KEY = 'caa69d0a-e4ea-4a00-9bfc-0d180842ce34';
        const SQUARESPACE_API_BASE = 'https://api.squarespace.com/1.0/commerce/orders';

        // Handle CORS by using this as a proxy
        async function fetchOrders() {
            try {
                const response = await fetch(SQUARESPACE_API_BASE, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${SQUARESPACE_API_KEY}`,
                        'User-Agent': 'Wild Oaks Analytics/1.0'
                    }
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }

                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Error fetching orders:', error);
                return null;
            }
        }

        // Handle postMessage requests from parent window
        window.addEventListener('message', async (event) => {
            // Verify origin for security
            if (event.data.action === 'fetchOrders') {
                const orders = await fetchOrders();
                event.source.postMessage({
                    type: 'ordersResponse',
                    data: orders
                }, event.origin);
            }
        });

        // Signal that proxy is ready
        if (window.parent !== window) {
            window.parent.postMessage({ type: 'proxyReady' }, '*');
        }
    </script>
</body>
</html>
