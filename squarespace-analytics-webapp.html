<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard</title>
    <link rel="stylesheet" href="https://use.typekit.net/qjo3rmq.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            font-family: 'cooper-black-std', serif;
            background: #000 !important;
            color: #fff;
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
            width: 100%;
            height: 100%;
        }

        body.light-mode {
            background: #e6ddcf !important;
            color: #583521;
        }

        /* Force black background everywhere - override ALL Squarespace styles */
        html, body, #page, .sqs-block-code, .code-block, main, section, article, div {
            background-color: #000 !important;
        }

        body.light-mode html,
        body.light-mode body,
        body.light-mode #page,
        body.light-mode .sqs-block-code,
        body.light-mode .code-block,
        body.light-mode main,
        body.light-mode section,
        body.light-mode article,
        body.light-mode div {
            background-color: #e6ddcf !important;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            background: #000;
        }

        body.light-mode .container {
            background: #e6ddcf;
        }

        header {
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        .header-title {
            font-size: 28px;
            font-weight: bold;
        }

        .theme-toggle {
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: border-color 0.3s;
        }

        body.light-mode .theme-toggle {
            border-color: #583521;
        }

        .pages-container {
            flex: 1;
            display: flex;
            overflow: hidden;
            touch-action: pan-y;
            will-change: transform;
        }

        .page {
            min-width: 100%;
            padding: 20px 30px 140px 30px;
            overflow-y: auto;
            transition: none;
        }

        .page-indicators {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s;
        }

        body.light-mode .indicator {
            background: rgba(88, 53, 33, 0.3);
        }

        .indicator.active {
            background: #fff;
            width: 24px;
            border-radius: 4px;
        }

        body.light-mode .indicator.active {
            background: #583521;
        }

        .nav-arrows {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 20px;
            z-index: 9;
            margin-left: -120px;
        }

        @media (min-width: 768px) {
            .nav-arrows {
                display: flex;
            }
        }

        .nav-arrow {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.3s;
        }

        body.light-mode .nav-arrow {
            background: rgba(88, 53, 33, 0.2);
        }

        .nav-arrow:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        body.light-mode .nav-arrow:hover {
            background: rgba(88, 53, 33, 0.4);
        }

        .nav-arrow.disabled {
            opacity: 0.3;
            pointer-events: none;
        }

        .dropdown-container {
            margin: 30px 0;
        }

        .dropdown {
            width: 100%;
            max-width: 300px;
            padding: 15px 20px;
            border: 3px solid #fff;
            border-radius: 15px;
            background: transparent;
            color: #fff;
            font-family: 'cooper-black-std', serif;
            font-size: 16px;
            cursor: pointer;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        body.light-mode .dropdown {
            border-color: #583521;
            color: #583521;
        }

        .dropdown-options {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #000;
            border: 3px solid #fff;
            border-radius: 15px;
            margin-top: 10px;
            display: none;
            z-index: 100;
        }

        body.light-mode .dropdown-options {
            background: #e6ddcf;
            border-color: #583521;
        }

        .dropdown-options.open {
            display: block;
        }

        .dropdown-option {
            padding: 15px 20px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .dropdown-option:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        body.light-mode .dropdown-option:hover {
            background: rgba(88, 53, 33, 0.1);
        }

        .data-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            margin-top: 30px;
        }

        @media (min-width: 768px) {
            .data-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .data-column {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .data-column.faded {
            opacity: 0.7;
        }

        .data-block {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .data-label {
            font-size: 18px;
            font-weight: bold;
        }

        .data-value {
            font-size: 32px;
            font-weight: bold;
        }

        .search-box {
            width: 100%;
            max-width: 400px;
            padding: 15px 20px;
            border: 3px solid #fff;
            border-radius: 15px;
            background: transparent;
            color: #fff;
            font-family: 'cooper-black-std', serif;
            font-size: 16px;
            margin: 30px 0;
        }

        body.light-mode .search-box {
            border-color: #583521;
            color: #583521;
        }

        .search-box::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        body.light-mode .search-box::placeholder {
            color: rgba(88, 53, 33, 0.5);
        }

        .product-suggestions {
            position: absolute;
            background: #000;
            border: 3px solid #fff;
            border-radius: 15px;
            margin-top: 10px;
            max-height: 300px;
            overflow-y: auto;
            display: none;
            z-index: 100;
        }

        body.light-mode .product-suggestions {
            background: #e6ddcf;
            border-color: #583521;
        }

        .product-suggestions.open {
            display: block;
        }

        .product-suggestion {
            padding: 15px 20px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .product-suggestion:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        body.light-mode .product-suggestion:hover {
            background: rgba(88, 53, 33, 0.1);
        }

        .product-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }

        .product-detail-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
            opacity: 0.9;
        }

        .product-detail-label {
            font-size: 14px;
            opacity: 0.8;
        }

        .product-detail-value {
            font-size: 24px;
            font-weight: bold;
        }

        .selected-product-name {
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
        }

        .all-months-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
            max-height: calc(100vh - 300px);
            overflow-y: auto;
            padding-bottom: 20px;
        }

        .month-item {
            padding: 15px;
            border: 2px solid #fff;
            border-radius: 10px;
            text-align: center;
        }

        body.light-mode .month-item {
            border-color: #583521;
        }

        .month-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .month-revenue {
            font-size: 20px;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 20px;
        }

        .gradient-overlay {
            position: fixed;
            bottom: 80px;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(to bottom, transparent, #000);
            pointer-events: none;
            display: none;
        }

        body.light-mode .gradient-overlay {
            background: linear-gradient(to bottom, transparent, #e6ddcf);
        }

        .gradient-overlay.visible {
            display: block;
        }

        /* Shipping Progress Styles */
        .shipping-container {
            display: flex;
            flex-direction: column;
            gap: 40px;
            margin-top: 30px;
        }

        .shipping-item {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .shipping-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .shipping-period {
            font-size: 24px;
            font-weight: bold;
        }

        .shipping-status {
            font-size: 24px;
            font-weight: bold;
        }

        .progress-bar-container {
            width: 100%;
            height: 50px;
            border: 4px solid #fff;
            border-radius: 80px;
            overflow: hidden;
            background: transparent;
        }

        body.light-mode .progress-bar-container {
            border-color: #583521;
        }

        .progress-bar-fill {
            height: 100%;
            background: #00ff00;
            transition: width 0.5s ease-out;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-title" id="pageHeader">Analytics</div>
            <div class="theme-toggle" id="themeToggle">🌙</div>
        </header>

        <div class="pages-container" id="pagesContainer">
            <!-- Page 1: Analytics -->
            <div class="page" data-page="0">
                <div class="dropdown-container" style="position: relative;">
                    <div class="dropdown" id="timeDropdown">
                        <span id="dropdownText">Select Time</span>
                        <span id="dropdownArrow">▼</span>
                    </div>
                    <div class="dropdown-options" id="dropdownOptions">
                        <div class="dropdown-option" data-value="today">Today</div>
                        <div class="dropdown-option" data-value="month">Month</div>
                        <div class="dropdown-option" data-value="year">Year</div>
                        <div class="dropdown-option" data-value="all-months">All Months</div>
                    </div>
                </div>
                <div id="analyticsContent"></div>
            </div>

            <!-- Page 2: Products -->
            <div class="page" data-page="1">
                <div style="position: relative;">
                    <input type="text" class="search-box" id="productSearch" placeholder="Search products...">
                    <div class="product-suggestions" id="productSuggestions"></div>
                </div>
                <div id="productContent"></div>
            </div>

            <!-- Page 3: Shipping Progress -->
            <div class="page" data-page="2">
                <div id="shippingContent" class="loading">Loading shipping data...</div>
            </div>

            <!-- Page 4: Affiliates -->
            <div class="page" data-page="3">
                <div style="padding: 50px 0; text-align: center; opacity: 0.5;">
                    Coming Soon
                </div>
            </div>

            <!-- Page 5: Commission -->
            <div class="page" data-page="4">
                <div style="padding: 50px 0; text-align: center; opacity: 0.5;">
                    Coming Soon
                </div>
            </div>
        </div>

        <div class="nav-arrows">
            <div class="nav-arrow disabled" id="prevArrow">←</div>
            <div class="nav-arrow" id="nextArrow">→</div>
        </div>

        <div class="page-indicators" id="pageIndicators">
            <div class="indicator active" data-page="0"></div>
            <div class="indicator" data-page="1"></div>
            <div class="indicator" data-page="2"></div>
            <div class="indicator" data-page="3"></div>
            <div class="indicator" data-page="4"></div>
        </div>

        <div class="gradient-overlay" id="gradientOverlay"></div>
    </div>

    <script>
        // Configuration
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1r4mI_fcZCax-PSi3T9eY8TLzqe6OB0sg5kIdmi-Gfbc/export?format=csv';
        const GITHUB_ORDERS_URL = 'https://raw.githubusercontent.com/wildoaksapothecaryadmin/squarespace-api-proxy/refs/heads/main/orders-summary.json';

        let ordersData = [];
        let currentPage = 0;
        const totalPages = 5;
        const pageHeaders = ['Analytics', 'Products', 'Shipping Progress', 'Affiliates', 'Commission'];

        // Ensure dark mode on load
        document.body.style.background = '#000';

        // Theme toggle
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            themeToggle.textContent = document.body.classList.contains('light-mode') ? '☀' : '🌙';
        });

        // Page navigation
        function goToPage(pageIndex) {
            if (pageIndex < 0 || pageIndex >= totalPages) return;

            currentPage = pageIndex;
            const container = document.getElementById('pagesContainer');
            container.style.transform = `translateX(-${pageIndex * 100}%)`;
            container.style.transition = 'transform 0.3s ease-out';

            document.querySelectorAll('.indicator').forEach((ind, idx) => {
                ind.classList.toggle('active', idx === pageIndex);
            });

            document.getElementById('pageHeader').textContent = pageHeaders[pageIndex];

            document.getElementById('prevArrow').classList.toggle('disabled', pageIndex === 0);
            document.getElementById('nextArrow').classList.toggle('disabled', pageIndex === totalPages - 1);

            // Load shipping data when navigating to shipping page
            if (pageIndex === 2 && !window.shippingDataLoaded) {
                loadShippingData();
            }
        }

        // Arrow navigation
        document.getElementById('prevArrow').addEventListener('click', () => goToPage(currentPage - 1));
        document.getElementById('nextArrow').addEventListener('click', () => goToPage(currentPage + 1));

        // Indicator navigation
        document.querySelectorAll('.indicator').forEach(ind => {
            ind.addEventListener('click', () => {
                goToPage(parseInt(ind.dataset.page));
            });
        });

        // Touch swipe - improved responsiveness
        let touchStartX = 0;
        let touchEndX = 0;
        let isDragging = false;
        const container = document.getElementById('pagesContainer');

        container.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            isDragging = true;
        }, { passive: true });

        container.addEventListener('touchmove', e => {
            if (!isDragging) return;
            touchEndX = e.changedTouches[0].screenX;
            const diff = touchEndX - touchStartX;
            const currentTransform = -(currentPage * 100);
            const dragPercentage = (diff / window.innerWidth) * 100;
            container.style.transition = 'none';
            container.style.transform = `translateX(${currentTransform + dragPercentage}%)`;
        }, { passive: true });

        container.addEventListener('touchend', e => {
            if (!isDragging) return;
            isDragging = false;
            touchEndX = e.changedTouches[0].screenX;
            const diff = touchStartX - touchEndX;

            if (Math.abs(diff) > 30) {
                if (diff > 0) {
                    goToPage(currentPage + 1);
                } else {
                    goToPage(currentPage - 1);
                }
            } else {
                goToPage(currentPage);
            }
        }, { passive: true });

        // Dropdown functionality
        const dropdown = document.getElementById('timeDropdown');
        const dropdownOptions = document.getElementById('dropdownOptions');
        const dropdownText = document.getElementById('dropdownText');
        const dropdownArrow = document.getElementById('dropdownArrow');

        dropdown.addEventListener('click', () => {
            dropdownOptions.classList.toggle('open');
            if (dropdownOptions.classList.contains('open')) {
                dropdownArrow.textContent = '✕';
            } else {
                dropdownArrow.textContent = '▼';
            }
        });

        document.querySelectorAll('.dropdown-option').forEach(option => {
            option.addEventListener('click', (e) => {
                e.stopPropagation();
                const value = option.dataset.value;
                dropdownText.textContent = option.textContent;
                dropdownOptions.classList.remove('open');
                dropdownArrow.textContent = dropdownOptions.classList.contains('open') ? '✕' : '▼';
                updateAnalytics(value);
            });
        });

        // Parse CSV data
        function parseCSV(text) {
            const lines = text.split('\n');
            const headers = lines[0].split(',');
            const data = [];

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;

                const values = [];
                let current = '';
                let inQuotes = false;

                for (let char of lines[i]) {
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        values.push(current.trim());
                        current = '';
                    } else {
                        current += char;
                    }
                }
                values.push(current.trim());

                const row = {};
                headers.forEach((header, index) => {
                    row[header.trim()] = values[index] || '';
                });
                data.push(row);
            }

            return data;
        }

        // Load data
        async function loadData() {
            try {
                const response = await fetch(SHEET_URL);
                const text = await response.text();
                ordersData = parseCSV(text);
                console.log('Loaded orders:', ordersData.length);
                initializeProducts();
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('analyticsContent').innerHTML = '<div class="loading">Error loading data. Please refresh the page.</div>';
            }
        }

        // Date helpers
        function parseDate(dateStr) {
            if (!dateStr) return null;

            if (dateStr.includes('-')) {
                return new Date(dateStr);
            } else {
                const parts = dateStr.split(' ')[0].split('/');
                const timeParts = dateStr.split(' ')[1].split(':');
                return new Date(parts[2], parts[0] - 1, parts[1], timeParts[0], timeParts[1]);
            }
        }

        function getRevenue(orders, startDate, endDate) {
            const seen = new Set();
            let total = 0;

            orders.forEach(order => {
                const orderDate = parseDate(order['Created at']);
                if (!orderDate || orderDate < startDate || orderDate > endDate) return;

                const orderNum = order['Order Number'];
                const totals = order['TOTALS'];

                if (totals && !seen.has(orderNum)) {
                    seen.add(orderNum);
                    const amount = parseFloat(totals.replace('$', '').replace(',', ''));
                    if (!isNaN(amount)) total += amount;
                }
            });

            return total;
        }

        function formatCurrency(amount) {
            return '$' + amount.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }

        // Analytics functions
        function updateAnalytics(selection) {
            const content = document.getElementById('analyticsContent');
            const now = new Date();

            if (selection === 'all-months') {
                showAllMonths();
                return;
            }

            content.innerHTML = '';

            if (selection === 'today') {
                showTodayAnalytics(now);
            } else if (selection === 'month') {
                showMonthAnalytics(now);
            } else if (selection === 'year') {
                showYearAnalytics(now);
            }
        }

        function showTodayAnalytics(now) {
            const content = document.getElementById('analyticsContent');

            const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const todayEnd = new Date(todayStart.getTime() + 86400000);
            const yesterdayStart = new Date(todayStart.getTime() - 86400000);
            const lastMonthSameDay = new Date(now.getFullYear(), now.getMonth() - 1, now.getDate());
            const lastMonthSameDayEnd = new Date(lastMonthSameDay.getTime() + 86400000);
            const prevMonthSameDay = new Date(now.getFullYear(), now.getMonth() - 2, now.getDate());
            const prevMonthSameDayEnd = new Date(prevMonthSameDay.getTime() + 86400000);
            const lastYearSameDay = new Date(now.getFullYear() - 1, now.getMonth(), now.getDate());
            const lastYearSameDayEnd = new Date(lastYearSameDay.getTime() + 86400000);

            const todayRev = getRevenue(ordersData, todayStart, todayEnd);
            const yesterdayRev = getRevenue(ordersData, yesterdayStart, todayStart);
            const lastMonthRev = getRevenue(ordersData, lastMonthSameDay, lastMonthSameDayEnd);
            const prevMonthRev = getRevenue(ordersData, prevMonthSameDay, prevMonthSameDayEnd);
            const lastYearRev = getRevenue(ordersData, lastYearSameDay, lastYearSameDayEnd);

            content.innerHTML = `
                <div class="data-grid">
                    <div class="data-column">
                        <div class="data-block">
                            <div class="data-label">Today</div>
                            <div class="data-value">${formatCurrency(todayRev)}</div>
                        </div>
                        <div class="data-block">
                            <div class="data-label">Yesterday</div>
                            <div class="data-value">${formatCurrency(yesterdayRev)}</div>
                        </div>
                    </div>
                    <div class="data-column faded">
                        <div class="data-block">
                            <div class="data-label">Last Month</div>
                            <div class="data-value">${formatCurrency(lastMonthRev)}</div>
                        </div>
                        <div class="data-block">
                            <div class="data-label">Previous Month</div>
                            <div class="data-value">${formatCurrency(prevMonthRev)}</div>
                        </div>
                        <div class="data-block">
                            <div class="data-label">Last Year</div>
                            <div class="data-value">${formatCurrency(lastYearRev)}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function showMonthAnalytics(now) {
            const content = document.getElementById('analyticsContent');

            const thisMonthStart = new Date(now.getFullYear(), now.getMonth(), 1);
            const thisMonthEnd = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59);
            const lastMonthStart = new Date(now.getFullYear(), now.getMonth() - 1, 1);
            const lastMonthEnd = new Date(now.getFullYear(), now.getMonth(), 0, 23, 59, 59);
            const prevMonthStart = new Date(now.getFullYear(), now.getMonth() - 2, 1);
            const prevMonthEnd = new Date(now.getFullYear(), now.getMonth() - 1, 0, 23, 59, 59);
            const lastYearSameMonthStart = new Date(now.getFullYear() - 1, now.getMonth(), 1);
            const lastYearSameMonthEnd = new Date(now.getFullYear() - 1, now.getMonth() + 1, 0, 23, 59, 59);
            const prevYearSameMonthStart = new Date(now.getFullYear() - 2, now.getMonth(), 1);
            const prevYearSameMonthEnd = new Date(now.getFullYear() - 2, now.getMonth() + 1, 0, 23, 59, 59);

            const thisMonthRev = getRevenue(ordersData, thisMonthStart, thisMonthEnd);
            const lastMonthRev = getRevenue(ordersData, lastMonthStart, lastMonthEnd);
            const prevMonthRev = getRevenue(ordersData, prevMonthStart, prevMonthEnd);
            const lastYearRev = getRevenue(ordersData, lastYearSameMonthStart, lastYearSameMonthEnd);
            const prevYearRev = getRevenue(ordersData, prevYearSameMonthStart, prevYearSameMonthEnd);

            const allMonths = getAllMonthsRevenue();
            const monthlyAvg = allMonths.reduce((sum, m) => sum + m.revenue, 0) / allMonths.length;

            const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            const prevMonthName = monthNames[prevMonthStart.getMonth()];

            content.innerHTML = `
                <div class="data-grid">
                    <div class="data-column">
                        <div class="data-block">
                            <div class="data-label">This Month</div>
                            <div class="data-value">${formatCurrency(thisMonthRev)}</div>
                        </div>
                        <div class="data-block">
                            <div class="data-label">Last Month</div>
                            <div class="data-value">${formatCurrency(lastMonthRev)}</div>
                        </div>
                        <div class="data-block">
                            <div class="data-label">${prevMonthName}</div>
                            <div class="data-value">${formatCurrency(prevMonthRev)}</div>
                        </div>
                    </div>
                    <div class="data-column faded">
                        <div class="data-block">
                            <div class="data-label">Monthly Average</div>
                            <div class="data-value">${formatCurrency(monthlyAvg)}</div>
                        </div>
                        <div class="data-block">
                            <div class="data-label">Last Year</div>
                            <div class="data-value">${formatCurrency(lastYearRev)}</div>
                        </div>
                        <div class="data-block">
                            <div class="data-label">Previous Year</div>
                            <div class="data-value">${formatCurrency(prevYearRev)}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function showYearAnalytics(now) {
            const content = document.getElementById('analyticsContent');

            const thisYearStart = new Date(now.getFullYear(), 0, 1);
            const thisYearEnd = new Date(now.getFullYear(), 11, 31, 23, 59, 59);
            const lastYearStart = new Date(now.getFullYear() - 1, 0, 1);
            const lastYearEnd = new Date(now.getFullYear() - 1, 11, 31, 23, 59, 59);

            const thisYearRev = getRevenue(ordersData, thisYearStart, thisYearEnd);
            const lastYearRev = getRevenue(ordersData, lastYearStart, lastYearEnd);

            const allYears = getAllYearsRevenue();
            const completeYears = allYears.filter(y => y.year < now.getFullYear());
            const yearlyAvg = completeYears.length > 0
                ? completeYears.reduce((sum, y) => sum + y.revenue, 0) / completeYears.length
                : 0;

            let rightColumn = `
                <div class="data-block">
                    <div class="data-label">Yearly Average</div>
                    <div class="data-value">${formatCurrency(yearlyAvg)}</div>
                </div>
            `;

            for (let i = 2; i <= 3; i++) {
                const year = now.getFullYear() - i;
                const yearStart = new Date(year, 0, 1);
                const yearEnd = new Date(year, 11, 31, 23, 59, 59);
                const yearRev = getRevenue(ordersData, yearStart, yearEnd);

                if (yearRev > 0) {
                    rightColumn += `
                        <div class="data-block">
                            <div class="data-label">${year}</div>
                            <div class="data-value">${formatCurrency(yearRev)}</div>
                        </div>
                    `;
                }
            }

            content.innerHTML = `
                <div class="data-grid">
                    <div class="data-column">
                        <div class="data-block">
                            <div class="data-label">This Year</div>
                            <div class="data-value">${formatCurrency(thisYearRev)}</div>
                        </div>
                        <div class="data-block">
                            <div class="data-label">Last Year</div>
                            <div class="data-value">${formatCurrency(lastYearRev)}</div>
                        </div>
                    </div>
                    <div class="data-column faded">
                        ${rightColumn}
                    </div>
                </div>
            `;
        }

        function getAllMonthsRevenue() {
            const months = new Map();

            ordersData.forEach(order => {
                const orderDate = parseDate(order['Created at']);
                if (!orderDate) return;

                const key = `${orderDate.getFullYear()}-${orderDate.getMonth()}`;
                if (!months.has(key)) {
                    months.set(key, {
                        year: orderDate.getFullYear(),
                        month: orderDate.getMonth(),
                        revenue: 0
                    });
                }
            });

            const result = [];
            months.forEach((value, key) => {
                const [year, month] = key.split('-').map(Number);
                const start = new Date(year, month, 1);
                const end = new Date(year, month + 1, 0, 23, 59, 59);
                value.revenue = getRevenue(ordersData, start, end);
                result.push(value);
            });

            return result.sort((a, b) => {
                if (a.year !== b.year) return b.year - a.year;
                return b.month - a.month;
            });
        }

        function getAllYearsRevenue() {
            const years = new Set();

            ordersData.forEach(order => {
                const orderDate = parseDate(order['Created at']);
                if (orderDate) years.add(orderDate.getFullYear());
            });

            return Array.from(years).map(year => {
                const start = new Date(year, 0, 1);
                const end = new Date(year, 11, 31, 23, 59, 59);
                return {
                    year,
                    revenue: getRevenue(ordersData, start, end)
                };
            }).sort((a, b) => b.year - a.year);
        }

        function showAllMonths() {
            const content = document.getElementById('analyticsContent');
            const allMonths = getAllMonthsRevenue();
            const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

            let html = '<div class="all-months-grid">';
            allMonths.forEach(m => {
                html += `
                    <div class="month-item">
                        <div class="month-name">${monthNames[m.month]} ${m.year}</div>
                        <div class="month-revenue">${formatCurrency(m.revenue)}</div>
                    </div>
                `;
            });
            html += '</div>';

            content.innerHTML = html;

            const grid = content.querySelector('.all-months-grid');
            if (grid.scrollHeight > grid.clientHeight) {
                document.getElementById('gradientOverlay').classList.add('visible');
            }
        }

        // Product search functionality
        let allProducts = [];

        function initializeProducts() {
            const productMap = new Map();

            ordersData.forEach(order => {
                const productName = order['Line Item Name'];
                if (productName && productName.trim()) {
                    if (!productMap.has(productName)) {
                        productMap.set(productName, {
                            name: productName,
                            totalSold: 0,
                            revenue: 0,
                            lastOrdered: null,
                            orders: []
                        });
                    }

                    const product = productMap.get(productName);
                    const qty = parseInt(order['Line Item Quantity']) || 0;
                    const price = parseFloat(order['Line Item Price']) || 0;
                    const orderDate = parseDate(order['Created at']);

                    product.totalSold += qty;
                    product.revenue += price * qty;
                    product.orders.push(orderDate);

                    if (!product.lastOrdered || orderDate > product.lastOrdered) {
                        product.lastOrdered = orderDate;
                    }
                }
            });

            allProducts = Array.from(productMap.values()).sort((a, b) =>
                a.name.localeCompare(b.name)
            );
        }

        const productSearch = document.getElementById('productSearch');
        const productSuggestions = document.getElementById('productSuggestions');

        productSearch.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();

            if (!query) {
                productSuggestions.classList.remove('open');
                return;
            }

            const matches = allProducts.filter(p =>
                p.name.toLowerCase().includes(query)
            ).slice(0, 10);

            if (matches.length > 0) {
                productSuggestions.innerHTML = matches.map(p =>
                    `<div class="product-suggestion" data-product="${p.name}">${p.name}</div>`
                ).join('');
                productSuggestions.classList.add('open');

                document.querySelectorAll('.product-suggestion').forEach(sugg => {
                    sugg.addEventListener('click', () => {
                        selectProduct(sugg.dataset.product);
                    });
                });
            } else {
                productSuggestions.classList.remove('open');
            }
        });

        function selectProduct(productName) {
            productSearch.value = productName;
            productSuggestions.classList.remove('open');
            showProductDetails(productName);
        }

        function showProductDetails(productName) {
            const product = allProducts.find(p => p.name === productName);
            if (!product) return;

            const now = new Date();
            const thisYearStart = new Date(now.getFullYear(), 0, 1);
            const lastYearStart = new Date(now.getFullYear() - 1, 0, 1);
            const lastYearEnd = new Date(now.getFullYear() - 1, 11, 31, 23, 59, 59);

            let thisYearRev = 0;
            let lastYearRev = 0;

            ordersData.forEach(order => {
                if (order['Line Item Name'] === productName) {
                    const orderDate = parseDate(order['Created at']);
                    const qty = parseInt(order['Line Item Quantity']) || 0;
                    const price = parseFloat(order['Line Item Price']) || 0;
                    const revenue = qty * price;

                    if (orderDate >= thisYearStart) {
                        thisYearRev += revenue;
                    } else if (orderDate >= lastYearStart && orderDate <= lastYearEnd) {
                        lastYearRev += revenue;
                    }
                }
            });

            const monthlyOrders = {};
            product.orders.forEach(date => {
                if (!date) return;
                const key = `${date.getFullYear()}-${date.getMonth()}`;
                monthlyOrders[key] = (monthlyOrders[key] || 0) + 1;
            });
            const monthlyAvg = Object.keys(monthlyOrders).length > 0
                ? Object.values(monthlyOrders).reduce((a, b) => a + b, 0) / Object.keys(monthlyOrders).length
                : 0;

            const lastOrderedStr = product.lastOrdered
                ? product.lastOrdered.toLocaleDateString()
                : 'N/A';

            const content = document.getElementById('productContent');
            content.innerHTML = `
                <div class="selected-product-name">${product.name}</div>
                <div class="product-details">
                    <div class="product-detail-item">
                        <div class="product-detail-label">Total Sold</div>
                        <div class="product-detail-value">${product.totalSold}</div>
                    </div>
                    <div class="product-detail-item">
                        <div class="product-detail-label">Revenue All Time</div>
                        <div class="product-detail-value">${formatCurrency(product.revenue)}</div>
                    </div>
                    <div class="product-detail-item">
                        <div class="product-detail-label">Revenue This Year</div>
                        <div class="product-detail-value">${formatCurrency(thisYearRev)}</div>
                    </div>
                    <div class="product-detail-item">
                        <div class="product-detail-label">Revenue Last Year</div>
                        <div class="product-detail-value">${lastYearRev > 0 ? formatCurrency(lastYearRev) : 'N/A'}</div>
                    </div>
                    <div class="product-detail-item">
                        <div class="product-detail-label">Last Ordered</div>
                        <div class="product-detail-value">${lastOrderedStr}</div>
                    </div>
                    <div class="product-detail-item">
                        <div class="product-detail-label">Monthly Orders</div>
                        <div class="product-detail-value">${monthlyAvg.toFixed(1)}</div>
                    </div>
                </div>
            `;
        }

        // Shipping Progress functionality - UPDATED TO USE SUMMARY JSON
        window.shippingDataLoaded = false;

        async function loadShippingData() {
            const content = document.getElementById('shippingContent');

            try {
                console.log('Loading shipping data from:', GITHUB_ORDERS_URL);

                // Load pre-calculated summary from GitHub
                const response = await fetch(GITHUB_ORDERS_URL);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                console.log('Loaded summary data:', data);

                // Check if data structure is valid
                if (!data.summary) {
                    throw new Error('Invalid data structure - missing summary');
                }

                const today = data.summary.today || {total: 0, fulfilled: 0, pending: 0, percentage: 0};
                const week = data.summary.thisWeek || {total: 0, fulfilled: 0, pending: 0, percentage: 0};
                const month = data.summary.thisMonth || {total: 0, fulfilled: 0, pending: 0, percentage: 0};

                content.innerHTML = `
                    <div class="shipping-container">
                        <div class="shipping-item">
                            <div class="shipping-header">
                                <div class="shipping-period">Today</div>
                                <div class="shipping-status">${today.fulfilled}/${today.total} Orders Fulfilled</div>
                            </div>
                            <div class="progress-bar-container">
                                <div class="progress-bar-fill" style="width: ${today.percentage}%"></div>
                            </div>
                        </div>

                        <div class="shipping-item">
                            <div class="shipping-header">
                                <div class="shipping-period">This Week</div>
                                <div class="shipping-status">${week.fulfilled}/${week.total} Orders Fulfilled</div>
                            </div>
                            <div class="progress-bar-container">
                                <div class="progress-bar-fill" style="width: ${week.percentage}%"></div>
                            </div>
                        </div>

                        <div class="shipping-item">
                            <div class="shipping-header">
                                <div class="shipping-period">This Month</div>
                                <div class="shipping-status">${month.fulfilled}/${month.total} Orders Fulfilled</div>
                            </div>
                            <div class="progress-bar-container">
                                <div class="progress-bar-fill" style="width: ${month.percentage}%"></div>
                            </div>
                        </div>
                    </div>
                `;

                console.log('Shipping data displayed successfully');
                window.shippingDataLoaded = true;

                // Auto-refresh every 15 minutes
                setTimeout(() => {
                    window.shippingDataLoaded = false;
                    if (currentPage === 2) {
                        loadShippingData();
                    }
                }, 15 * 60 * 1000);

            } catch (error) {
                console.error('Error loading shipping data:', error);
                content.innerHTML = `
                    <div class="loading">
                        <div style="margin-bottom: 20px;">Error loading shipping data</div>
                        <div style="font-size: 14px; opacity: 0.7;">${error.message}</div>
                        <div style="font-size: 14px; opacity: 0.7; margin-top: 10px;">URL: ${GITHUB_ORDERS_URL}</div>
                        <div style="font-size: 14px; margin-top: 20px;">Open browser console (F12) for details</div>
                    </div>
                `;
            }
        }

        // Initialize
        loadData();
    </script>
</body>
</html>
