name: Fetch Squarespace Orders

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  fetch-orders:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch orders from Squarespace API
        run: |
          SINCE_DATE="2025-11-01T00:00:00Z"
          BEFORE_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          CURSOR=""
          PAGE_NUM=1
          ALL_ORDERS="[]"

          while true; do
            echo "Fetching page $PAGE_NUM..."

            # Build URL with cursor if we have one
            if [ -z "$CURSOR" ]; then
              URL="https://api.squarespace.com/1.0/commerce/orders?createdAfter=$SINCE_DATE&createdBefore=$BEFORE_DATE"
            else
              URL="https://api.squarespace.com/1.0/commerce/orders?createdAfter=$SINCE_DATE&createdBefore=$BEFORE_DATE&cursor=$CURSOR"
            fi

            RESPONSE=$(curl -s -w "\n%{http_code}" "$URL" \
              -H "Authorization: Bearer ${{ secrets.SQUARESPACE_API_KEY }}" \
              -H "User-Agent: WildOaksAnalytics/1.0")

            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')

            if [ "$HTTP_CODE" != "200" ]; then
              echo "API request failed with status $HTTP_CODE"
              echo "$BODY"
              break
            fi

            RESULT_COUNT=$(echo "$BODY" | jq '.result | length')
            echo "Got $RESULT_COUNT orders on this page"

            if [ "$RESULT_COUNT" -eq 0 ]; then
              echo "No more results, stopping pagination"
              break
            fi

            # Append results
            if [ "$ALL_ORDERS" = "[]" ]; then
              ALL_ORDERS=$(echo "$BODY" | jq '{result: .result}')
            else
              ALL_ORDERS=$(echo "$ALL_ORDERS" "$BODY" | jq -s '{result: (.[0].result + .[1].result)}')
            fi

            # Check for next page cursor
            HAS_NEXT=$(echo "$BODY" | jq -r '.pagination.hasNextPage // false')
            if [ "$HAS_NEXT" = "true" ]; then
              CURSOR=$(echo "$BODY" | jq -r '.pagination.nextPageCursor')
              echo "Has next page, cursor: ${CURSOR:0:20}..."
              PAGE_NUM=$((PAGE_NUM + 1))
              sleep 1
            else
              echo "No more pages"
              break
            fi

            # Safety limit
            if [ "$PAGE_NUM" -gt 100 ]; then
              echo "Reached safety limit of 100 pages"
              break
            fi
          done

          echo "$ALL_ORDERS" | jq '{
            lastUpdated: (now | strftime("%Y-%m-%dT%H:%M:%SZ")),
            orders: [.result[] | {
              orderNumber: .orderNumber,
              createdOn: .createdOn,
              modifiedOn: .modifiedOn,
              fulfillmentStatus: .fulfillmentStatus,
              customerEmail: .customerEmail
            }]
          }' > orders.json

          echo "Fetched $(echo "$ALL_ORDERS" | jq '.result | length') orders"

      - name: Calculate summary statistics
        run: |
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          CURRENT_YEAR=$(date -u +"%Y")
          CURRENT_MONTH=$(date -u +"%m")

          # Calculate date boundaries
          TODAY_START=$(date -u +"%Y-%m-%d")T00:00:00Z

          # Week start (Sunday at 00:00:00)
          WEEK_START=$(date -u -d "last sunday" +"%Y-%m-%d" 2>/dev/null || date -u -v-sunday +"%Y-%m-%d")T00:00:00Z

          # Month start - special case for December 2025
          if [ "$CURRENT_YEAR" = "2025" ] && [ "$CURRENT_MONTH" = "12" ]; then
            MONTH_START="2025-11-29T00:00:00Z"
            echo "Using special December 2025 start date: Nov 29"
          else
            MONTH_START=$(date -u +"%Y-%m-01")T00:00:00Z
          fi

          echo "Date ranges:"
          echo "  Today: $TODAY_START"
          echo "  Week: $WEEK_START"
          echo "  Month: $MONTH_START"

          # Create summary JSON with calculations
          jq --arg now "$NOW" \
             --arg today_start "$TODAY_START" \
             --arg week_start "$WEEK_START" \
             --arg month_start "$MONTH_START" \
          '{
            lastUpdated: $now,
            summary: {
              today: {
                total: [.orders[] | select(.createdOn >= $today_start)] | length,
                fulfilled: [.orders[] | select(.createdOn >= $today_start and .fulfillmentStatus == "FULFILLED")] | length,
                pending: [.orders[] | select(.createdOn >= $today_start and .fulfillmentStatus == "PENDING")] | length
              },
              thisWeek: {
                total: [.orders[] | select(.createdOn >= $week_start)] | length,
                fulfilled: [.orders[] | select(.createdOn >= $week_start and .fulfillmentStatus == "FULFILLED")] | length,
                pending: [.orders[] | select(.createdOn >= $week_start and .fulfillmentStatus == "PENDING")] | length
              },
              thisMonth: {
                total: [.orders[] | select(.createdOn >= $month_start)] | length,
                fulfilled: [.orders[] | select(.createdOn >= $month_start and .fulfillmentStatus == "FULFILLED")] | length,
                pending: [.orders[] | select(.createdOn >= $month_start and .fulfillmentStatus == "PENDING")] | length
              }
            }
          } |
          .summary.today.percentage = (if .summary.today.total > 0 then ((.summary.today.fulfilled / .summary.today.total) * 100 | round) else 0 end) |
          .summary.thisWeek.percentage = (if .summary.thisWeek.total > 0 then ((.summary.thisWeek.fulfilled / .summary.thisWeek.total) * 100 | round) else 0 end) |
          .summary.thisMonth.percentage = (if .summary.thisMonth.total > 0 then ((.summary.thisMonth.fulfilled / .summary.thisMonth.total) * 100 | round) else 0 end)
          ' orders.json > orders-summary.json

          echo "Summary created:"
          cat orders-summary.json | jq .

      - name: Commit and push if changed
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add orders.json orders-summary.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update orders data - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
            echo "Changes committed and pushed"
          fi
